server {
    listen 1027;
    host 0.0.0.0;
    server_name localhost;

    root /goinfre/moel-aid/Aidi/www;
    index index.html;
    # client_max_body_size 1000000;

    location / {
        autoindex on;
        index index.html;
        allowed_methods GET;
    }

    location /directory/Yeah/ {
        root /goinfre/moel-aid/official/www;
        index youpi.bad_extension;
        allowed_methods GET POST;
    }

    location /directory/ {
        index youpi.bad_extension;
        allowed_methods GET POST;
    }
}

