server {
    listen 1027;
    host 0.0.0.0;
    server_name localhost;
	client_max_body_size 150m;
    root /home/mzanana/Desktop/Github/AlaaVersion/EngineX/www-subject-tester;
    index index.htm;
    autoindex on;

    location / {
        autoindex off;
        index index.htm;
        allowed_methods GET;
    }

    location /directory/Yeah {
        root /home/mzanana/Desktop/Github/AlaaVersion/EngineX;
        allowed_methods GET POST;
    }

    location /directory/Yeah/not_happy.bad_extension {
        root /home/mzanana/Desktop/Github/AlaaVersion/EngineX/www-subject-tester;
        allowed_methods GET;
    }

	location /post_body {
			allowed_methods POST;
	}

    location /directory {
        index youpi.bad_extension;
        allowed_methods GET POST;
		cgi_extension .bla /home/mzanana/Desktop/Github/AlaaVersion/EngineX/www-subject-tester/cgi_tester;
	}
}

