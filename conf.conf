server {
    listen 8080;
    host 0.0.0.0;
    server_name localhost:8080;
    root /home/salhali/Desktop/lastversion/www/;
    index index.html ;
    client_max_body_size 10000000000000;

    
    location / {
        autoindex on;
        allowed_methods GET POST DELETE;
        cgi_extension .py /usr/bin/;
        


        # cgi_extension .sh /usr/bb;
    }
    location / {
        allowed_methods GET POST DELETE;
        cgi_extension .py /usr/bin/ls;
        # cgi_extension .sh /usr/bb;
    }
    error_page 404  /404.html;
    error_page 500 /500.html;
}

