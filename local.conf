server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost;

    root /home/aazzaoui/Webserv/www;
    index index.html;
    client_max_body_size 1M;
    error_page 404 /error_pages/404.html;

    location / {
        autoindex on;
        index index.html;
        allowed_methods GET POST DELETE;
    }

    location /upload/ {
        root /home/aazzaoui/Webserv/www;
        allowed_methods GET POST DELETE;
    }
}
